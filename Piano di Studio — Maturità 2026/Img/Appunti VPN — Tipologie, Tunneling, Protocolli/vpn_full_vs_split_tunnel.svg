<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Diagramma che mostra in alto il full tunnel dove tutto il traffico del laptop passa attraverso il gateway VPN aziendale prima di raggiungere Internet o la LAN aziendale, e in basso il split tunnel dove solo il traffico verso la rete aziendale passa nel tunnel mentre il resto va diretto su Internet.</desc>
